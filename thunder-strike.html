            mb.width = Math.round(mb.width * 1.3);
            mb.height = Math.round(mb.height * 1.3);
            mb.color = '#ff8800';
            mb.x = WIDTH / 2;
            mb.y = -80;
            enemies.push(mb);
          }
          
          // Big boss at 120 seconds (7200 frames)
          if (elapsed >= 7200 && !boss) {
            bossPhase = true;
            if (typeof audioManager !== 'undefined' && audioManager) {
              audioManager.play('boss');
            }
            boss = new Boss();
          }
        }

        function checkCollisions() {
            if (!player) return;

            for (const bullet of bullets) {
                if (!bullet.active) continue;
                
                for (const enemy of enemies) {
                    if (!enemy.active) continue;
                    
                    if (bullet.x > enemy.x - enemy.width / 2 &&
                        bullet.x < enemy.x + enemy.width / 2 &&
                        bullet.y > enemy.y - enemy.height / 2 &&
                        bullet.y < enemy.y + enemy.height / 2) {
                        
                        bullet.active = false;
                        enemy.hit(bullet.damage);
                    }
                }
                
                if (boss && boss.active) {
                    if (bullet.x > boss.x - boss.width / 2 &&
                        bullet.x < boss.x + boss.width / 2 &&
                        bullet.y > boss.y - boss.height / 2 &&
                        bullet.y < boss.y + boss.height / 2) {
                        
                        bullet.active = false;
                        boss.hit(bullet.damage);
                    }
                }
            }

            if (player.respawnTimer <= 0) {
                for (const bullet of enemyBullets) {
                    if (!bullet.active || player.invincible) continue;
                    
                    if (bullet.x > player.x - player.width / 2 &&
                        bullet.x < player.x + player.width / 2 &&
                        bullet.y > player.y - player.height / 2 &&
                        bullet.y < player.y + player.height / 2) {
                        
                        bullet.active = false;
                        player.hit();
                    }
                }

                for (const enemy of enemies) {
                    if (!enemy.active) continue;
                    
                    if (player && !player.invincible) {
                        const dx = player.x - enemy.x;
                        const dy = player.y - enemy.y;
                        const distSq = dx * dx + dy * dy;
                        const threshold = (player.width + enemy.width) / 3;
                        
                        if (distSq < threshold * threshold) {
                            enemy.hit(5);
                            player.hit();
                        }
                    }
                }
                
                if (boss && boss.active && player && !player.invincible) {
                    const dx = player.x - boss.x;
                    const dy = player.y - boss.y;
                    const distSq = dx * dx + dy * dy;
                    const threshold = (player.width + boss.width) / 3;
                    
                    if (distSq < threshold * threshold) {
                        player.hit();
                    }
                }
            }
            
            for (const powerup of powerups) {
                if (!powerup.active) continue;
                
                if (player && player.respawnTimer <= 0) {
                    const dx = player.x - powerup.x;
                    const dy = player.y - powerup.y;
                    const distSq = dx * dx + dy * dy;
                    const threshold = (player.width + powerup.width) / 2;
                    
                    if (distSq < threshold * threshold) {
                        powerup.collect();
                    }
                }
            }
        }

        function useBomb() {
            if (bombs <= 0 || !player) return;
            
            bombs--;
            updateUI();
            sfx.play('explode');
            screenShake = 15;
            
            for (const enemy of enemies) {
                enemy.hp = 0;
                enemy.active = false;
                createExplosion(enemy.x, enemy.y, 25, enemy.color);
                createExplosion(enemy.x, enemy.y, 15, '#ffffff');
                score += enemy.score;
            }
            
            if (boss && boss.active) {
                boss.hp -= 10;
                createExplosion(boss.x, boss.y, 40, COLORS.boss);
            }
            
            // Clear all bullets on screen
            enemyBullets = [];
            for (const b of bullets) b.active = false;
            
            createExplosion(WIDTH / 2, HEIGHT / 2, 60, '#ffff00');
            createExplosion(WIDTH / 2, HEIGHT / 2, 40, '#ffffff');
            
            updateUI();
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('bombCount').textContent = bombs;
            
            const lifePanel = document.getElementById('lifePanel');
            lifePanel.innerHTML = '';
            for (let i = 0; i < player.lives; i++) {
                const heart = document.createElement('div');
                heart.className = 'life-icon';
                lifePanel.appendChild(heart);
            }
        }

        function updatePowerBar() {
            const powerBar = document.getElementById('powerBar');
            powerBar.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const pip = document.createElement('div');
                pip.className = 'power-pip' + (i >= (player?.powerLevel || 0) ? ' empty' : '');
                powerBar.appendChild(pip);
            }
        }

        function gameOver() {
          if (gameOverTriggered) return;
          gameOverTriggered = true;
          gameState = 'gameover';
          if (typeof audioManager !== 'undefined' && audioManager) {
            audioManager.stop();
          }
          
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('thunderStrikeHighScore', highScore);
            document.getElementById('highScore').textContent = highScore;
          }
          
          var messageEl = document.getElementById('gameMessage');
          messageEl.innerHTML = ''
            + '<h1>GAME OVER</h1>'
            + '<p style="font-size: 24px; color: #00ff88; margin: 20px 0;">SCORE: ' + score + '</p>'
            + '<p style="font-size: 14px; color: #888;">Reached: LEVEL ' + (currentLevel + 1) + ' \u2014 ' + LEVELS[currentLevel].name + '</p>'
            + '<button class="start-btn" onclick="startGame()">\u91cd\u65b0\u5f00\u59cb</button>';
          messageEl.classList.remove('hidden');
        }

        function startGame() {
          score = 0;
          gameOverTriggered = false;
          carryPower = 1;
          document.getElementById('gameMessage').classList.add('hidden');
          startLevel(0);
        }

        function gameLoop() {
          gameTime++;
          
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
          
          // Screen shake
          if (screenShake > 0) {
            ctx.translate(
              (Math.random() - 0.5) * screenShake,
              (Math.random() - 0.5) * screenShake
            );
            screenShake *= 0.85;
            if (screenShake < 0.5) screenShake = 0;
          }
          
          // Render level background
          if (gameState === 'menu') {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
          } else {
            var theme = LEVELS[currentLevel].theme;
            backgroundRenderer.render(ctx, gameTime, theme);
          }
          
          // Render stars on top of background (not during menu)
          if (gameState !== 'menu') {
            for (var si = 0; si < stars.length; si++) {
              stars[si].update();
              stars[si].draw();
            }
            ctx.globalAlpha = 1;
          }
          
          if (gameState === 'levelIntro') {
            levelIntroTimer--;
            renderLevelIntro(ctx);
            if (levelIntroTimer <= 0) {
              gameState = 'playing';
              if (typeof audioManager !== 'undefined' && audioManager) {
                audioManager.play('normal');
              }
            }
          } else if (gameState === 'playing' || gameState === 'boss') {
            spawnEnemies();
            
            if (player) {
              player.update();
              player.draw();
            }
            
            for (var ei = 0; ei < enemies.length; ei++) {
              enemies[ei].update();
              enemies[ei].draw();
            }
            enemies = enemies.filter(function(e) { return e.active; });
            
            if (boss) {
              boss.update();
              boss.draw();
              if (!boss.active && bossPhase) {
                // Boss defeated
                bossPhase = false;
                gameState = 'stageClear';
                stageClearTimer = 180;
                if (typeof audioManager !== 'undefined' && audioManager) {
                  audioManager.play('victory');
                }
                boss = null;
              }
            }
            
            for (var bi = 0; bi < bullets.length; bi++) {
              bullets[bi].update();
              bullets[bi].draw();
            }
            bullets = bullets.filter(function(b) { return b.active; });
            
            for (var ebi = 0; ebi < enemyBullets.length; ebi++) {
              enemyBullets[ebi].update();
              enemyBullets[ebi].draw();
            }
            enemyBullets = enemyBullets.filter(function(b) { return b.active; });
            
            for (var pi = 0; pi < powerups.length; pi++) {
              powerups[pi].update();
              powerups[pi].draw();
            }
            powerups = powerups.filter(function(p) { return p.active; });
            
            for (var xi = 0; xi < explosions.length; xi++) {
              explosions[xi].update();
              explosions[xi].draw();
            }
            explosions = explosions.filter(function(e) { return e.active; });
            
            checkCollisions();
            
          } else if (gameState === 'stageClear') {
            stageClearTimer--;
            renderStageClear(ctx);
            
            // Keep drawing remaining entities
            for (var exi = 0; exi < explosions.length; exi++) {
              explosions[exi].update();
              explosions[exi].draw();
            }
            explosions = explosions.filter(function(e) { return e.active; });
            
            if (stageClearTimer <= 0) {
              startNextLevel();
            }
            
          } else if (gameState === 'victory') {
            renderVictory(ctx);
          }
          
          requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            useMouseControl = false;
            
            if (e.code === 'Space' && gameState === 'playing') {
                e.preventDefault();
            }
            
            if (e.code === 'KeyB' && gameState === 'playing') {
                useBomb();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (WIDTH / rect.width);
            mouseY = (e.clientY - rect.top) * (HEIGHT / rect.height);
            useMouseControl = true;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                mouseDown = true;
                useMouseControl = true;
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                mouseDown = false;
            }
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        let touchStartX = 0;
        let touchStartY = 0;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let touchActive = false;
        let touchShoot = false;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchStartX = (touch.clientX - rect.left) * (WIDTH / rect.width);
            touchStartY = (touch.clientY - rect.top) * (HEIGHT / rect.height);
            lastTouchX = touchStartX;
            lastTouchY = touchStartY;
            touchActive = true;
            touchShoot = true;
            mouseX = touchStartX;
            mouseY = touchStartY;
            useMouseControl = true;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!touchActive) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const currentX = (touch.clientX - rect.left) * (WIDTH / rect.width);
            const currentY = (touch.clientY - rect.top) * (HEIGHT / rect.height);
            
            const dx = currentX - lastTouchX;
            const dy = currentY - lastTouchY;
            
            mouseX += dx * 2;
            mouseY += dy * 2;
            mouseX = Math.max(20, Math.min(WIDTH - 20, mouseX));
            mouseY = Math.max(20, Math.min(HEIGHT - 20, mouseY));
            
            lastTouchX = currentX;
            lastTouchY = currentY;
            useMouseControl = true;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchActive = false;
            touchShoot = false;
        }, { passive: false });

        canvas.addEventListener('touchcancel', (e) => {
            touchActive = false;
            touchShoot = false;
        }, { passive: false });

        const btnShoot = document.getElementById('btnShoot');
        const btnBomb = document.getElementById('btnBomb');

        if (btnShoot) {
            btnShoot.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                touchShoot = true;
            }, { passive: false });
            btnShoot.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                touchShoot = false;
            }, { passive: false });
        }

        if (btnBomb) {
            btnBomb.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (gameState === 'playing') {
                    useBomb();
                }
            }, { passive: false });
        }

        function getTouchShoot() {
            return touchShoot;
        }

        document.getElementById('startBtn').addEventListener('click', startGame);

        // Victory click → return to menu
        canvas.addEventListener('click', function() {
          if (gameState === 'victory') {
            gameState = 'menu';
            var msgEl = document.getElementById('gameMessage');
            msgEl.innerHTML = ''
              + '<h1>THUNDER STRIKE</h1>'
              + '<p>\u65b9\u5411\u952e/WASD - \u79fb\u52a8 | \u7a7a\u683c - \u5c04\u51fb</p>'
              + '<p>\u9f20\u6807 - \u79fb\u52a8 | \u5de6\u952e - \u5c04\u51fb</p>'
              + '<p>\u89e6\u5c4f - \u62d6\u52a8\u79fb\u52a8 | \u70b9\u51fb\u5c04\u51fb</p>'
              + '<button class="start-btn" id="startBtn" onclick="startGame()">\u5f00\u59cb\u6e38\u620f</button>';
            msgEl.classList.remove('hidden');
          }
        });

        for (let i = 0; i < 80; i++) {
            stars.push(new Star());
        }

        gameLoop();
    </script>
</body>
</html>
